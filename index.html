<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Pattern Zoom</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: #111;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: grab;
}

canvas.dragging {
    cursor: grabbing;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const img = new Image();
img.src = "image.png";

// Kamera
let cameraX = 0;
let cameraY = 0;

// Zoom
let zoom = 1;
const MIN_ZOOM = 0.1;
const MAX_ZOOM = 8;

// Tile Offset (Versatz zwischen Kacheln)
const TILE_OFFSET_X = 0;
const TILE_OFFSET_Y = -58;

// Touch pinch
let pinchDistance = null;

// Drag
let dragging = false;
let lastX = 0;
let lastY = 0;

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

function getDistance(t1, t2) {
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.hypot(dx, dy);
}

function draw() {
    if (!img.width) {
        requestAnimationFrame(draw);
        return;
    }

    const w = img.width;
    const h = img.height;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const stepX = w;
    const stepY = h;

    const cols = Math.ceil(canvas.width / (w * zoom)) + 4;
    const rows = Math.ceil(canvas.height / (h * zoom)) + 4;

    const startCol = Math.floor(cameraX / w) - 2;
    const startRow = Math.floor(cameraY / h) - 2;

    for (let row = startRow; row < startRow + rows; row++) {

        const rowOffsetX = row * TILE_OFFSET_X;

        for (let col = startCol; col < startCol + cols; col++) {

            const colOffsetY = col * TILE_OFFSET_Y;

            const x = (col * stepX + rowOffsetX - cameraX) * zoom;
            const y = (row * stepY + colOffsetY - cameraY) * zoom;

            ctx.drawImage(
                img,
                x,
                y,
                w * zoom,
                h * zoom
            );
        }
    }

    requestAnimationFrame(draw);
}

img.onload = () => {
    draw();
};

// --------------------
// Maus Drag
// --------------------
canvas.addEventListener("mousedown", (e) => {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    canvas.classList.add("dragging");
});

window.addEventListener("mouseup", () => {
    dragging = false;
    canvas.classList.remove("dragging");
});

window.addEventListener("mousemove", (e) => {
    if (!dragging) return;

    cameraX -= (e.clientX - lastX) / zoom;
    cameraY -= (e.clientY - lastY) / zoom;

    lastX = e.clientX;
    lastY = e.clientY;
});

// --------------------
// Zoom (Mausrad)
// --------------------
canvas.addEventListener("wheel", (e) => {
    e.preventDefault();

    const mouseX = e.clientX;
    const mouseY = e.clientY;

    const worldX = cameraX + mouseX / zoom;
    const worldY = cameraY + mouseY / zoom;

    const factor = e.deltaY < 0 ? 1.1 : 0.9;

    zoom *= factor;
    zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom));

    cameraX = worldX - mouseX / zoom;
    cameraY = worldY - mouseY / zoom;
}, { passive: false });

// --------------------
// Touch (Drag + Pinch)
// --------------------
canvas.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) {
        pinchDistance = getDistance(e.touches[0], e.touches[1]);
    } else if (e.touches.length === 1) {
        dragging = true;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
    }
}, { passive: true });

canvas.addEventListener("touchmove", (e) => {

    if (e.touches.length === 2) {
        const t1 = e.touches[0];
        const t2 = e.touches[1];

        const newDist = getDistance(t1, t2);

        const centerX = (t1.clientX + t2.clientX) / 2;
        const centerY = (t1.clientY + t2.clientY) / 2;

        const worldX = cameraX + centerX / zoom;
        const worldY = cameraY + centerY / zoom;

        if (pinchDistance !== null) {
            zoom *= newDist / pinchDistance;
            zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom));
        }

        cameraX = worldX - centerX / zoom;
        cameraY = worldY - centerY / zoom;

        pinchDistance = newDist;
        return;
    }

    if (dragging && e.touches.length === 1) {
        const t = e.touches[0];

        cameraX -= (t.clientX - lastX) / zoom;
        cameraY -= (t.clientY - lastY) / zoom;

        lastX = t.clientX;
        lastY = t.clientY;
    }

}, { passive: true });

canvas.addEventListener("touchend", () => {
    dragging = false;
    pinchDistance = null;
});
</script>

</body>
</html>
